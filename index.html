<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4sgm URL Cleaner</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 5rem;
        }

        #response {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Enter a URL to Clean</h1>
                        <form id="url-form">
                            <div class="form-group">
                                <input type="text" id="url-input" class="form-control" placeholder="Enter URL here" required>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" onclick="sendRequest()">Clean URL</button>
                        </form>
                        <div id="response" class="text-center mt-3"></div>
                        <button type="button" id="copy-btn" class="btn btn-secondary btn-block mt-2" style="display:none;" onclick="copyCleanedUrl()">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        let cleanedUrl = '';

        function sendRequest() {
            const url = document.getElementById('url-input').value;
            const copyBtn = document.getElementById('copy-btn');
            fetch('/clean_url', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url: url }),
            })
            .then(response => response.json())
            .then(data => {
                cleanedUrl = data.cleaned_url;
                document.getElementById('response').innerHTML = `<strong>Cleaned URL:</strong> ${cleanedUrl}`;
                copyBtn.style.display = 'block';
                copyBtn.textContent = 'Copy';
            })
            .catch(error => {
                document.getElementById('response').innerHTML = '<strong>Error:</strong> Unable to clean the URL';
                copyBtn.style.display = 'none';
                console.error('Error:', error);
            });
        }

        // navigator.clipboard only exists in secure contexts (HTTPS or localhost),
        // so plain-HTTP access over the LAN needs the execCommand fallback.
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(textarea);
            return ok ? Promise.resolve() : Promise.reject(new Error('execCommand copy failed'));
        }

        function copyCleanedUrl() {
            if (!cleanedUrl) return;
            const copyBtn = document.getElementById('copy-btn');
            const copy = (navigator.clipboard && window.isSecureContext)
                ? navigator.clipboard.writeText(cleanedUrl).catch(() => fallbackCopy(cleanedUrl))
                : fallbackCopy(cleanedUrl);
            copy.then(() => {
                copyBtn.textContent = 'Copied!';
                setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
            }).catch(error => {
                copyBtn.textContent = 'Copy failed';
                console.error('Copy failed:', error);
            });
        }
    </script>
</body>
</html>
